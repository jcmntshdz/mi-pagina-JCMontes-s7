<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registros</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    .caja, li { background: #1b232e !important; border-color: #2b3644 !important; }
    input, textarea { background: #253040 !important; color: #e8eef5 !important; border-color: #2b3644 !important; }
  }
  .caja {
    background: #fff; border: 1px solid #dde3ea; border-radius: 14px;
    padding: 34px; max-width: 480px; width: 100%;
    box-shadow: 0 10px 30px -18px rgba(0,0,0,.3);
    box-sizing: border-box;
    margin-bottom: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 18px; }
  label { display: block; font-size: 14px; margin: 14px 0 6px; }
  input, textarea {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    border: 1px solid #dde3ea; border-radius: 8px; font: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: #1a2027; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { background: #e8eef5; color: #121820; } }
  button:disabled { opacity: .6; cursor: default; }
  #estado { font-size: 14px; margin-top: 10px; min-height: 18px; }
  .lista { max-width: 480px; width: 100%; box-sizing: border-box; }
  .lista h2 { font-size: 16px; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li {
    background: #fff; border: 1px solid #dde3ea; border-radius: 10px;
    padding: 14px 16px; box-sizing: border-box;
  }
  li .nombre { font-weight: 600; }
  li .mensaje { margin-top: 4px; line-height: 1.45; }
  .vacio, .cargando { font-size: 14px; opacity: .75; }
</style>
</head>
<body>
  <div class="caja">
    <h1>Deja tu registro</h1>
    <form id="form-registro">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" required maxlength="200">

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" required maxlength="2000"></textarea>

      <button type="submit">Guardar</button>
      <div id="estado"></div>
    </form>
  </div>

  <div class="lista">
    <h2>Lo que se ha guardado</h2>
    <ul id="lista-registros">
      <li class="cargando">Cargando…</li>
    </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://ybntauidvcywjgdysazd.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_v19pB4uxbHq0MPQ-looq4Q_F_xY_P7U";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("form-registro");
    const estado = document.getElementById("estado");
    const lista = document.getElementById("lista-registros");

    function escapaHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }

    async function cargarRegistros() {
      const { data, error } = await supabase
        .from("registros")
        .select("nombre, mensaje, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        lista.innerHTML = '<li class="vacio">No se pudo cargar todavía.</li>';
        return;
      }

      if (!data || data.length === 0) {
        lista.innerHTML = '<li class="vacio">Todavía no hay nada aquí.</li>';
        return;
      }

      lista.innerHTML = data.map((r) => `
        <li>
          <div class="nombre">${escapaHtml(r.nombre)}</div>
          <div class="mensaje">${escapaHtml(r.mensaje)}</div>
        </li>
      `).join("");
    }

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const boton = form.querySelector("button");
      boton.disabled = true;
      estado.textContent = "Guardando…";

      const nombre = form.nombre.value.trim();
      const mensaje = form.mensaje.value.trim();

      const { error } = await supabase.from("registros").insert({ nombre, mensaje });

      if (error) {
        estado.textContent = "Algo falló, intenta de nuevo.";
      } else {
        estado.textContent = "¡Guardado!";
        form.reset();
        await cargarRegistros();
      }
      boton.disabled = false;
    });

    cargarRegistros();
  </script>
</body>
</html>
