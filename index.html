<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    .caja, .espacio-formulario { background: #1b232e !important; border-color: #2b3644 !important; }
  }
  .caja {
    background: #fff; border: 1px solid #dde3ea; border-radius: 14px;
    padding: 34px; max-width: 480px; width: 100%;
    box-shadow: 0 10px 30px -18px rgba(0,0,0,.3);
    box-sizing: border-box;
  }
  h1 { font-size: 22px; margin: 0 0 10px; }
  .explicacion { margin: 0; line-height: 1.55; }
  .espacio-formulario {
    margin-top: 24px;
    border: 1px dashed #b7c0cb; border-radius: 10px;
    padding: 20px;
    text-align: center;
    font-size: 14px; opacity: .75;
  }
</style>
</head>
<body>
  <div class="caja">
    <h1>Buzón de sugerencias de mi área</h1>
    <p class="explicacion">
      Este espacio es para que cualquiera del área deje una sugerencia,
      comentario o idea de mejora.
    </p>
    <div class="espacio-formulario">
      Aquí va el formulario (siguiente paso).
    </div>
  </div>
</body>
</html>
